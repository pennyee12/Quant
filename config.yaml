schwab:
  token_file: "/home/yip/data/schwab/token.json"
  api_base_url: "https://api.schwabapi.com"
  token_url: "https://api.schwabapi.com/v1/oauth/token"
  credential_script: "/home/yip/scripts/run_schwab_keepalive.sh"

backtest:
  initial_capital: 20000
  monthly_inject: 0
  fee_bps: 1
  slippage_bps: 5
  period_type: "year"
  period: 20
  frequency_type: "daily"
  frequency: 1
  start_date: "2016-01-01"
  end_date: ""
  fill_model: "next_open"
  cache_dir: "data/bars"

strategy:
  ema_bars: 21
  stddev_bars: 21
  momentum_bars: 10
  mean_reversion_weight: 0.70
  momentum_weight: 0.30
  beta: 1.35
  gamma: 0.70
  sigma_floor: 0.005
  min_trade_usd: 10.10
  target_deadband_weight: 0.08
  max_position_weight: 0.95
  max_trade_pct_equity: 0.25
  rebalance_cooldown_bars: 5
  urgent_rebalance_weight: 0.20

